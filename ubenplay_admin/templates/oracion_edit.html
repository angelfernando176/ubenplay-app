{% extends "base.html" %}
{% block title %}Editar Oración{% endblock %}
{% block content %}
<h1>✏️ Editar Oración #{{ o.id_oracion }}</h1>

<div class="card">
    <form method="POST">
        <label>Palabra asociada:</label>
        <p><strong>{{ palabra_nombre }}</strong></p>

        <label>Oración ejemplo:</label>
        <input type="text" name="oracion_ejemplo" value="{{ o.oracion_ejemplo or '' }}" style="width:100%" required>

        <label>Traducción:</label>
        <input type="text" name="oracion_traduccion" value="{{ o.oracion_traduccion or '' }}" style="width:100%">

        <label>Nivel de dificultad:</label>
        <select name="nivel_dificultad">
            <option value="1" {% if o.nivel_dificultad==1 %}selected{% endif %}>A1 Básico</option>
            <option value="2" {% if o.nivel_dificultad==2 %}selected{% endif %}>A2 Elemental</option>
            <option value="3" {% if o.nivel_dificultad==3 %}selected{% endif %}>B1 Intermedio</option>
            <option value="4" {% if o.nivel_dificultad==4 %}selected{% endif %}>B2 Avanzado</option>
        </select>

        <label>Palabras de la oración (se regeneran al guardar):</label>
        <p style="font-size:12px;color:#666">
            {% for po in palabras %}
            <span style="display:inline-block;margin:2px;padding:2px 6px;background:#e3f2fd;border-radius:4px">{{ po.orden }}. {{ po.palabra }}</span>
            {% endfor %}
        </p>

        <div style="margin-top:16px;display:flex;gap:8px">
            <button type="submit" class="btn btn-green">💾 Guardar</button>
            <a href="/oraciones" class="btn" style="background:#eee">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
